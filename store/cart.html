<style>
:root{
  --grad:linear-gradient(135deg,#3b82f6 0%,#8b5cf6 100%);
  --brand:#60a5fa;--card:rgba(255,255,255,.05);--line:rgba(255,255,255,.10);--line2:rgba(255,255,255,.16);
  --t1:#fff;--t2:#cbd5e1;--t3:#94a3b8;--t4:#64748b;--radius:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--t1);
  background:
    radial-gradient(1200px 600px at 80% -10%, rgba(139,92,246,.18), transparent 60%),
    radial-gradient(1000px 500px at 0% 10%, rgba(59,130,246,.16), transparent 55%),
    linear-gradient(180deg,#0B0F1E 0%,#141a2e 100%);
  background-attachment:fixed;min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
.glass{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 8px 30px rgba(0,0,0,.35);backdrop-filter:blur(12px)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;font-weight:600;font-size:15px;cursor:pointer;border:none;text-decoration:none;padding:12px 22px;color:#fff}
.btn-grad{background:var(--grad);box-shadow:0 8px 24px rgba(59,130,246,.35)}
.btn-grad:hover{filter:brightness(1.07)}
.btn-ghost{background:rgba(255,255,255,.05);border:1px solid var(--line2);color:#fff}
.btn-ghost:hover{background:rgba(255,255,255,.09)}
.btn:disabled{opacity:.6;cursor:default}
.badge{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:999px;padding:6px 14px;font-size:13px;color:var(--brand)}
.pill{border-radius:999px;padding:5px 12px;font-size:12px}

/* NAV */
nav{border-bottom:1px solid var(--line);background:#0B0F1E}
.nav-in{display:flex;align-items:center;justify-content:space-between;padding:14px 0}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:.3px;text-decoration:none;color:#fff}
.logo .mark{width:34px;height:34px;border-radius:9px;background:var(--grad);display:flex;align-items:center;justify-content:center}
.nav-actions{display:flex;align-items:center;gap:10px}
.nav-actions a.link{color:var(--t2);text-decoration:none;font-size:14px;padding:8px 12px}
.nav-actions a.link:hover{color:#fff}
@media(max-width:640px){.nav-actions a.link{display:none}}
.cart-btn{position:relative;display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:11px;background:rgba(255,255,255,.05);border:1px solid var(--line2);text-decoration:none}
.cart-btn:hover{background:rgba(255,255,255,.09)}
.cart-btn svg{width:20px;height:20px;stroke:#fff}
.cart-count{position:absolute;top:-6px;right:-6px;min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--grad);color:#fff;font-size:11.5px;font-weight:700;display:none;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(59,130,246,.5)}

/* HERO */
.hero{text-align:center;padding:80px 0 60px}
.hero h1{font-size:52px;line-height:1.05;font-weight:800;margin:20px auto;max-width:760px;letter-spacing:-.5px}
.hero p{color:var(--t2);font-size:18px;max-width:620px;margin:0 auto 32px;line-height:1.6}
.hero .cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
section{padding:44px 0}
h2{font-size:34px;font-weight:800;letter-spacing:-.3px}
.sub{color:var(--t3);margin-top:10px;font-size:15px;max-width:660px;line-height:1.6}

/* CATALOG */
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-top:28px}
.prod{padding:22px;display:flex;flex-direction:column}
.prod .cardimg{height:150px;border-radius:14px;margin-bottom:18px;display:flex;align-items:center;justify-content:center}
.cardimg.black{background:linear-gradient(135deg,#1f2430,#0d1017)}
.cardimg.white{background:linear-gradient(135deg,#eef2f7,#cdd6e4)}
.minicard{width:150px;height:94px;border-radius:12px;background:var(--grad);position:relative;box-shadow:0 10px 24px rgba(0,0,0,.4)}
.minicard .m{position:absolute;top:12px;left:14px;width:26px;height:26px;border-radius:7px;background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;color:#3b82f6;font-weight:800}
.minicard .txt{position:absolute;bottom:12px;left:14px;color:#fff;font-weight:800;font-size:13px;letter-spacing:.4px}
.tentmock{width:98px;height:114px;background:#fff;border-radius:12px 12px 6px 6px;box-shadow:0 12px 26px rgba(0,0,0,.45);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;transform:perspective(320px) rotateX(6deg)}
.prod .tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tag-color{background:rgba(255,255,255,.1);color:#e2e8f0}
.tag-tariff{background:rgba(59,130,246,.16);color:var(--brand);font-weight:600}
.prod h3{font-size:16px;font-weight:700;margin-bottom:12px}
.prod h3 a{text-decoration:none}
.prod h3 a:hover{color:var(--brand)}
.price{display:flex;align-items:baseline;gap:10px;margin-bottom:16px}
.price .now{font-size:26px;font-weight:800}
.price .old{color:var(--t4);text-decoration:line-through;font-size:15px}
.inc{list-style:none;display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
.inc li{display:flex;align-items:center;gap:8px;color:var(--t2);font-size:14px}
.inc .dot{color:var(--brand)}
.prod .desc{color:var(--t3);font-size:12.5px;line-height:1.55;flex:1;margin-bottom:18px}
.prod .actions{display:flex;gap:10px}
.prod .actions .btn{flex:1;padding:11px 10px;font-size:14px}

/* BENEFITS */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:28px}
.ben{padding:22px}
.ben .ic{width:44px;height:44px;border-radius:12px;background:var(--grad);display:flex;align-items:center;justify-content:center;margin-bottom:16px;font-size:20px}
.ben h3{font-size:16px;font-weight:700;margin-bottom:8px}
.ben p{color:var(--t3);font-size:14px;line-height:1.6}

/* STEPS */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:28px}
.step{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.step .num{width:34px;height:34px;border-radius:10px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;margin-bottom:12px}
.step h3{font-size:15px;margin-bottom:6px;color:#fff}
.step p{color:var(--t3);font-size:13px;line-height:1.55}
@media(max-width:760px){.steps{grid-template-columns:1fr 1fr}}

/* FAQ */
.faq{margin-top:24px;display:flex;flex-direction:column;gap:10px}
.faq details{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 18px}
.faq summary{cursor:pointer;padding:16px 0;font-weight:600;color:#fff;font-size:14.5px;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";color:var(--brand);font-size:20px;flex:0 0 auto}
.faq details[open] summary::after{content:"–"}
.faq details p{color:var(--t3);font-size:13.5px;line-height:1.6;padding:0 0 16px;margin:0}

/* FORMS */
label{display:block;font-size:13px;color:var(--t2);margin:14px 0 7px}
input,select,textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--line2);border-radius:12px;padding:12px 14px;color:#fff;font-size:14px;font-family:inherit;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--brand)}
input::placeholder,textarea::placeholder{color:#64748b}
select option{background:#0B0F1E}
textarea{min-height:84px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.note{color:var(--t4);font-size:12px;text-align:center;margin-top:12px;line-height:1.5}
.msg{border-radius:12px;padding:12px 14px;font-size:14px;margin-top:14px}
.msg.err{background:rgba(239,68,68,.12);color:#fca5a5}
.ok-box{text-align:center;padding:34px 22px}
.ok-box .circle{width:52px;height:52px;border-radius:50%;background:rgba(16,185,129,.15);color:#6ee7b7;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:26px}

/* BREADCRUMB */
.crumb{display:flex;gap:8px;align-items:center;color:var(--t4);font-size:13px;padding-top:22px}
.crumb a{color:var(--t3);text-decoration:none}
.crumb a:hover{color:#fff}

/* PRODUCT PAGE */
.pdp{display:grid;grid-template-columns:1fr 1fr;gap:32px;margin-top:24px;align-items:start}
.pdp .gallery{height:360px;border-radius:18px;display:flex;align-items:center;justify-content:center}
.pdp .gallery .minicard{width:230px;height:144px}
.pdp .gallery .minicard .m{width:38px;height:38px;top:16px;left:18px}
.pdp .gallery .minicard .txt{font-size:18px;bottom:16px;left:18px}
.pdp .gallery .tentmock{width:150px;height:176px}
.pdp h1{font-size:30px;font-weight:800;line-height:1.15;margin:8px 0 12px;letter-spacing:-.3px}
.pdp .tagline{color:var(--t2);font-size:15px;line-height:1.6;margin-bottom:18px}
.pdp .price{margin:6px 0 20px}
.pdp .price .now{font-size:34px}
.pdp .price .old{font-size:18px}
.pdp .block-title{font-size:14px;font-weight:700;color:#fff;margin:22px 0 10px}
.pdp .qtyrow{display:flex;align-items:center;gap:14px;margin:22px 0 16px}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line2);border-radius:12px;overflow:hidden}
.qty button{width:42px;height:44px;background:rgba(255,255,255,.05);border:none;color:#fff;font-size:20px;cursor:pointer}
.qty button:hover{background:rgba(255,255,255,.1)}
.qty input{width:52px;height:44px;text-align:center;border:none;border-left:1px solid var(--line2);border-right:1px solid var(--line2);border-radius:0;padding:0;background:transparent}
.pdp .buyrow{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}
.pdp .buyrow .btn{flex:1;min-width:160px;padding:14px}
.spec{list-style:none;display:flex;flex-direction:column;gap:9px}
.spec li{display:flex;gap:9px;color:var(--t2);font-size:14px;line-height:1.5}
.spec .dot{color:var(--brand);flex:0 0 auto}
.trust{display:flex;gap:18px;flex-wrap:wrap;margin-top:20px;color:var(--t3);font-size:13px}
.trust span{display:inline-flex;align-items:center;gap:7px}

/* CART PAGE */
.cart-wrap{display:grid;grid-template-columns:1.5fr 1fr;gap:26px;margin-top:24px;align-items:start}
.cart-item{display:flex;gap:16px;padding:16px;align-items:center}
.cart-item .thumb{width:96px;height:64px;flex:0 0 auto;border-radius:10px;display:flex;align-items:center;justify-content:center}
.cart-item .thumb .minicard{width:78px;height:49px;box-shadow:0 6px 14px rgba(0,0,0,.4)}
.cart-item .thumb .minicard .m{width:16px;height:16px;top:7px;left:8px}
.cart-item .thumb .minicard .txt{font-size:8px;bottom:7px;left:8px}
.cart-item .thumb .tentmock{width:44px;height:52px;gap:4px}
.cart-item .thumb .tentmock svg{width:16px;height:16px}
.cart-item .ci-main{flex:1;min-width:0}
.cart-item .ci-name{font-weight:700;font-size:14.5px;margin-bottom:4px}
.cart-item .ci-tags{color:var(--t3);font-size:12.5px}
.cart-item .ci-price{font-weight:800;font-size:16px;white-space:nowrap}
.cart-item .qty button{width:34px;height:36px;font-size:18px}
.cart-item .qty input{width:40px;height:36px}
.ci-remove{display:inline-flex;align-items:center;gap:6px;margin-top:9px;padding:7px 13px;background:rgba(248,113,113,.10);border:1px solid rgba(248,113,113,.32);border-radius:9px;color:#fca5a5;cursor:pointer;font-size:13px;font-weight:600;line-height:1;transition:background .15s,border-color .15s,color .15s}
.ci-remove:hover{background:rgba(248,113,113,.18);border-color:rgba(248,113,113,.55);color:#fecaca}
.ci-remove:active{transform:translateY(1px)}
.ci-remove svg{width:15px;height:15px;flex:0 0 auto}
.summary{padding:24px;position:sticky;top:86px}
.sumrow{display:flex;justify-content:space-between;color:var(--t2);font-size:14px;margin-bottom:10px}
.sumrow.total{color:#fff;font-size:20px;font-weight:800;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.empty-cart{text-align:center;padding:60px 20px;color:var(--t3)}
.dlv-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.dlv-tabs button{padding:10px;border-radius:11px;border:1px solid var(--line2);background:rgba(255,255,255,.04);color:var(--t2);font-weight:600;font-size:13.5px;cursor:pointer;font-family:inherit}
.dlv-tabs button.on{border-color:var(--brand);background:rgba(96,165,250,.14);color:#fff}
.dlv-wrap{position:relative}
.dlv-sug{position:absolute;left:0;right:0;top:100%;z-index:30;background:#141a2e;border:1px solid var(--line2);border-radius:12px;margin-top:4px;max-height:240px;overflow:auto;box-shadow:0 14px 40px rgba(0,0,0,.5)}
.dlv-sug div{padding:10px 14px;font-size:13.5px;color:var(--t2);cursor:pointer;border-bottom:1px solid var(--line)}
.dlv-sug div:hover{background:rgba(96,165,250,.12);color:#fff}
.dlv-list{max-height:230px;overflow:auto;border:1px solid var(--line2);border-radius:12px;margin-top:8px}
.dlv-pt{padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px;color:var(--t2);line-height:1.4}
.dlv-pt:last-child{border-bottom:none}
.dlv-pt b{display:block;color:#fff;font-weight:600;font-size:13.5px}
.dlv-pt small{color:var(--t4)}
.dlv-pt:hover{background:rgba(255,255,255,.04)}
.dlv-pt.on{background:rgba(96,165,250,.14);box-shadow:inset 3px 0 0 var(--brand)}
.dlv-q{margin-top:12px;padding:11px 13px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line);font-size:13.5px;color:var(--t2)}
.dlv-q b{color:#fff}
.dlv-q.err{background:rgba(239,68,68,.10);border-color:rgba(239,68,68,.3);color:#fca5a5}
.empty-cart .big{font-size:44px;margin-bottom:14px}
@media(max-width:860px){.pdp,.cart-wrap{grid-template-columns:1fr}.summary{position:static}}
@media(max-width:560px){
  .cart-item{flex-wrap:wrap;gap:12px}
  .cart-item .thumb{width:70px;height:46px}
  .cart-item .ci-main{flex:1 1 auto;min-width:0}
  .cart-item .ci-name{white-space:normal}
  .cart-item .qty{order:3}
  .cart-item .ci-price{order:4;margin-left:auto;align-self:center}
}

/* FOOTER */
footer{border-top:1px solid var(--line);margin-top:40px;padding:28px 0}
.foot{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;color:var(--t3);font-size:14px}
.foot a{color:var(--t3);text-decoration:none}.foot a:hover{color:#fff}

@media(max-width:760px){.hero h1{font-size:34px}.hero p{font-size:16px}h2{font-size:26px}.grid2,.grid3,.row{grid-template-columns:1fr}.pdp h1{font-size:24px}.wrap{padding-left:22px;padding-right:22px}.nav-in{padding-top:16px;padding-bottom:16px}}

/* DOC MODALS */
.doc-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:40px 16px;overflow-y:auto}
.doc-overlay.open{display:flex}
.doc-modal{background:#141a2e;border:1px solid rgba(255,255,255,.12);border-radius:18px;max-width:720px;width:100%;padding:28px;color:var(--t2);box-shadow:0 20px 60px rgba(0,0,0,.5)}
.doc-modal h2{color:#fff;font-size:22px;margin-bottom:4px}
.doc-modal h3{color:#fff;font-size:15px;margin:18px 0 6px}
.doc-modal p{font-size:13.5px;line-height:1.65;margin-bottom:8px}
.doc-modal ul{margin:0 0 10px 18px}
.doc-modal li{font-size:13.5px;line-height:1.6;margin-bottom:4px}
.doc-close{float:right;cursor:pointer;color:var(--t3);font-size:26px;line-height:1;border:none;background:none}
.doc-date{color:var(--t4);font-size:12px;margin-bottom:16px}

/* TOAST */
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:#141a2e;border:1px solid var(--line2);border-radius:14px;padding:14px 20px;color:#fff;font-size:14px;font-weight:600;box-shadow:0 16px 40px rgba(0,0,0,.5);z-index:200;opacity:0;pointer-events:none;transition:.3s;display:flex;align-items:center;gap:10px}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast .ok{color:#6ee7b7}

/* TELEGRAM POPUP */
.tg-pop{position:fixed;left:16px;right:16px;bottom:16px;max-width:380px;margin:0 auto;background:#141a2e;border:1px solid var(--line2);border-radius:18px;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.55);z-index:120;display:none}
.tg-pop.show{display:block;animation:tgUp .4s ease}
@keyframes tgUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.tg-pop h4{color:#fff;font-size:16px;margin-bottom:6px}
.tg-pop p{color:var(--t3);font-size:13px;line-height:1.5;margin-bottom:14px}
.tg-pop .tg-row{display:flex;gap:10px;align-items:center}
.tg-close-x{position:absolute;top:10px;right:14px;background:none;border:none;color:var(--t3);font-size:20px;cursor:pointer}

/* BACK TO TOP */
.to-top{position:fixed;right:16px;bottom:16px;width:46px;height:46px;border-radius:12px;background:var(--grad);border:none;color:#fff;display:none;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 8px 24px rgba(59,130,246,.45);z-index:90}
.to-top.show{display:flex}
.to-top svg{width:22px;height:22px;stroke:#fff;fill:none}

.cardimg.shopcar{position:relative}
.shopcar img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:contain;padding:16px;box-sizing:border-box;opacity:0;transition:opacity .7s ease}
.shopcar img.on{opacity:1}
.pdp .gallery{position:relative}
.tiers{width:100%;max-width:420px;border-collapse:collapse;margin:4px 0 18px;font-size:14px}.tiers td{padding:8px 12px;border-bottom:1px solid rgba(255,255,255,.08)}.tiers tr:first-child td{border-top:1px solid rgba(255,255,255,.08)}.tiers td:last-child{text-align:right}.colorsw{display:flex;gap:8px;margin:0 0 16px}.colorsw a{padding:8px 16px;border-radius:999px;border:1px solid rgba(255,255,255,.18);color:var(--t2);text-decoration:none;font-size:14px;font-weight:600}.colorsw a.on{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.4)}.tier-hint{color:#86efac;font-size:12.5px;margin-top:4px}
</style>

<body>

/* --- Утилиты --- */
function money(n) { return n.toLocaleString("ru-RU") + " ₽"; }

/* --- Оптовые цены на тейбл-тенты: скидка по общему количеству в линейке --- */
const TIERS = {
  brand: [[1,2790],[5,2390],[10,2190],[20,1990],[50,1790]],
  rev:   [[1,3790],[5,3290],[10,2990],[20,2790],[50,2490]]
};
function famQty(fam, cart){ cart = cart || getCart(); return cart.reduce(function(s,x){ var p=PRODUCTS[x.id]; return p && p.family===fam ? s + x.qty : s; }, 0); }
function tierFor(fam, q){ var u = TIERS[fam][0][1]; TIERS[fam].forEach(function(t){ if(q>=t[0]) u=t[1]; }); return u; }
function unitPrice(id, cart){ var p = PRODUCTS[id]; if(!p) return 0; if(!p.family || !TIERS[p.family]) return p.price; return tierFor(p.family, famQty(p.family, cart)); }
function nextTier(fam, q){ var n=null; TIERS[fam].forEach(function(t){ if(!n && t[0]>q) n=t; }); return n; }
function tiersTable(fam){
  var t = TIERS[fam], rows = t.map(function(r,i){ var to = t[i+1] ? (t[i+1][0]-1) : null; var lbl = to ? (r[0]===to ? r[0]+' шт.' : r[0]+'–'+to+' шт.') : ('от '+r[0]+' шт.'); var off = i ? ' <span style="color:#86efac">−'+Math.round((1-r[1]/t[0][1])*100)+'%</span>' : ''; return '<tr><td>'+lbl+'</td><td><b>'+money(r[1])+'</b> / шт.'+off+'</td></tr>'; }).join('');
  return '<table class="tiers">'+rows+'</table>';
}

/* --- Корзина (localStorage) --- */
const CART_KEY = "selfcards_cart";

function getCart() {
  try { return JSON.parse(localStorage.getItem(CART_KEY)) || []; }
  catch (e) { return []; }
}
function saveCart(cart) {
  try { localStorage.setItem(CART_KEY, JSON.stringify(cart)); } catch (e) {}
  updateCartBadge();
}
function addToCart(id, qty) { if(window.scGoal) scGoal("add_to_cart",{id:id});
  qty = parseInt(qty) || 1;
  const cart = getCart();
  const item = cart.find(function (x) { return x.id === id; });
  if (item) { item.qty += qty; } else { cart.push({ id: id, qty: qty }); }
  saveCart(cart);
}
function setQty(id, qty) {
  qty = parseInt(qty) || 1;
  if (qty < 1) qty = 1;
  const cart = getCart();
  const item = cart.find(function (x) { return x.id === id; });
  if (item) { item.qty = qty; saveCart(cart); }
}
function removeFromCart(id) {
  saveCart(getCart().filter(function (x) { return x.id !== id; }));
}
function cartCount() {
  return getCart().reduce(function (s, x) { return s + x.qty; }, 0);
}
function cartTotal() {
  return getCart().reduce(function (s, x) {
    const p = PRODUCTS[x.id]; return p ? s + unitPrice(x.id) * x.qty : s;
  }, 0);
}
function updateCartBadge() {
  const n = cartCount();
  document.querySelectorAll(".cart-count").forEach(function (el) {
    el.textContent = n;
    el.style.display = n > 0 ? "inline-flex" : "none";
  });
}

/* --- Всплывающее уведомление «добавлено» --- */
function toast(text) {
  var t = document.getElementById("toast");
  if (!t) {
    t = document.createElement("div");
    t.id = "toast";
    t.className = "toast";
    document.body.appendChild(t);
  }
  t.innerHTML = text;
  t.classList.add("show");
  clearTimeout(window.__toastT);
  window.__toastT = setTimeout(function () { t.classList.remove("show"); }, 2200);
}

/* --- Отправка заказа со всей корзиной одной заявкой --- */
async function submitOrder(customer) {
  const cart = getCart();
  if (!cart.length) throw new Error("empty");

  var lines = [];
  var total = 0;
  var totalQty = 0;
  cart.forEach(function (x) {
    var p = PRODUCTS[x.id];
    if (!p) return;
    var up = unitPrice(x.id); var sum = up * x.qty;
    total += sum; totalQty += x.qty;
    lines.push(x.qty + "×" + p.short + " — " + money(up) + " (" + money(sum) + ")");
  });

  var productSummary = cart.map(function (x) {
    var p = PRODUCTS[x.id]; return p ? (x.qty + "×" + p.short) : "";
  }).filter(Boolean).join(", ");

  var commentFull =
    "🛒 Состав заказа:\n" + lines.join("\n") +
    "\nИтого: " + money(total) + " (" + totalQty + " шт.)" +
    (customer.comment ? ("\n\nКомментарий клиента: " + customer.comment) : "");

  var order = {
    name: customer.name,
    phone: customer.phone,
    email: customer.email || "",
    product: productSummary + " — итого " + money(total),
    quantity: totalQty,
    city: customer.city || "",
    address: customer.address || "",
    comment: commentFull
  };

  var res = await fetch(SUPABASE_URL + "/rest/v1/orders", {
    method: "POST",
    headers: {
      "apikey": SUPABASE_KEY,
      "Authorization": "Bearer " + SUPABASE_KEY,
      "Content-Type": "application/json",
      "Prefer": "return=minimal"
    },
    body: JSON.stringify(order)
  });
  if (!res.ok) throw new Error("bad");
  return true;
}

          '<div class="ci-tags">'+(p.colorClass==="tent"?p.tariff:'Тариф «'+p.tariff+'»')+' · '+money(unitPrice(p.id))+' за шт.'+(p.family&&unitPrice(p.id)<p.price?' <s style="opacity:.6">'+money(p.price)+'</s>':'')+'</div>'+
          (p.family&&nextTier(p.family,famQty(p.family))?'<div class="tier-hint">Ещё '+(nextTier(p.family,famQty(p.family))[0]-famQty(p.family))+' шт. — и цена станет '+money(nextTier(p.family,famQty(p.family))[1])+' за шт.</div>':'')+
          '<button class="ci-remove" onclick="rm(\''+p.id+'\')" aria-label="Удалить товар из корзины"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>Удалить</button>'+
        '</div>'+
        '<div class="qty"><button type="button" onclick="dec(\''+p.id+'\')">−</button>'+
          '<input type="number" min="1" value="'+x.qty+'" onchange="setq(\''+p.id+'\',this.value)"><button type="button" onclick="inc(\''+p.id+'\')">+</button></div>'+
        '<div class="ci-price">'+money(unitPrice(p.id)*x.qty)+'</div>'+
      '</div>';
    }).join('');

    root.innerHTML =
      '<div class="cart-wrap">'+
        '<div style="display:flex;flex-direction:column;gap:14px">'+items+'</div>'+
        '<div class="glass summary">'+
          '<div class="sumrow"><span>Товары ('+cartCount()+' шт.)</span><span>'+money(cartTotal())+'</span></div>'+
          '<div class="sumrow"><span>Доставка</span><span id="sum-dlv" style="color:var(--t3)">'+(CDEK_ON?'выберите город':'рассчитывается отдельно')+'</span></div>'+
          '<div class="sumrow total"><span>Итого</span><span id="sum-total">'+money(cartTotal())+'</span></div>'+
          '<div id="formBox">'+
            '<div class="block-title" style="margin-top:20px">Ваши данные</div>'+
            '<div class="row">'+
              '<div><label>Имя *</label><input id="f-name" autocomplete="name" placeholder="Как к вам обращаться"></div>'+
              '<div><label>Телефон *</label><input id="f-phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="+7 900 000-00-00"></div>'+
            '</div>'+
            '<label>Email</label><input id="f-email" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com">'+
            (CDEK_ON ? dlvHTML() :
            '<div class="row">'+
              '<div><label>Город</label><input id="f-city" autocomplete="address-level2" placeholder="Москва"></div>'+
              '<div><label>Пункт выдачи / адрес доставки</label><input id="f-address" placeholder="ПВЗ или адрес"></div>'+
            '</div>')+
            '<label>Комментарий</label><textarea id="f-comment" placeholder="Пожелания к заказу"></textarea>'+
            '<div id="f-error" class="msg err" style="display:none"></div>'+
            '<button class="btn btn-grad" id="f-submit" style="width:100%;margin-top:18px;padding:14px">Оплатить '+money(grandTotal())+'</button>'+
            '<p class="note">Нажимая «Оплатить», вы соглашаетесь с обработкой персональных данных.<br>Оплата онлайн через ЮKassa.'+(CDEK_ON?' Доставка СДЭК по всей России.':' Доставка рассчитывается отдельно.')+'</p>'+
          '</div>'+
        '</div>'+
      '</div>';

    document.getElementById("f-submit").addEventListener("click", doSubmit);
    if(CDEK_ON) dlvMount();
    updateCartBadge();
  }

  function inc(id){ var c=getCart().find(function(x){return x.id===id;}); setQty(id,(c?c.qty:1)+1); render(); }
  function dec(id){ var c=getCart().find(function(x){return x.id===id;}); setQty(id,(c?c.qty:1)-1); render(); }
  function setq(id,v){ setQty(id,v); render(); }
  function rm(id){ removeFromCart(id); render(); }

  // Сопоставление id товаров магазина с SKU платёжного сервера.
  var SKU_MAP = {
    "black-business":"card_black_business",
    "black-basic":"card_black_basic",
    "white-basic":"card_white_basic",
    "white-business":"card_white_business",
    "tent-black":"tent_black",
    "tent-white":"tent_white",
    "rev-ya-black":"rev_ya_black", "rev-ya-white":"rev_ya_white",
    "rev-gis-black":"rev_gis_black", "rev-gis-white":"rev_gis_white",
    "rev-duo-black":"rev_duo_black", "rev-duo-white":"rev_duo_white"
  };
  var PAY_API = "https://app.selfcards.ru/api/create-payment";

  async function doSubmit(){
    var errBox=document.getElementById("f-error");
    errBox.style.display="none";
    var name=document.getElementById("f-name").value.trim();
    var phone=document.getElementById("f-phone").value.trim();
    if(!name||!phone){ errBox.textContent="Заполните имя и телефон."; errBox.style.display="block"; return; }
    var items=getCart().map(function(x){ return {sku:SKU_MAP[x.id], qty:x.qty}; }).filter(function(i){ return i.sku; });
    if(!items.length){ errBox.textContent="Корзина пуста."; errBox.style.display="block"; return; }
    var delivery=null;
    if(CDEK_ON){
      if(!D.city){ errBox.textContent="Выберите город доставки."; errBox.style.display="block"; return; }
      if(D.mode==="pvz" && !D.pvz){ errBox.textContent="Выберите пункт выдачи СДЭК."; errBox.style.display="block"; return; }
      if(D.mode==="door" && D.addr.trim().length<5){ errBox.textContent="Укажите адрес для курьера."; errBox.style.display="block"; return; }
      if(!D.quote){ errBox.textContent=D.err||"Подождите, считаем доставку…"; errBox.style.display="block"; return; }
      delivery={mode:D.mode, city_code:D.city.code, city_name:D.city.name, pvz_code:D.pvz?D.pvz.code:"", address:D.mode==="door"?D.addr.trim():""};
    }
    var btn=document.getElementById("f-submit");
    btn.disabled=true; btn.textContent="Переходим к оплате…";
    try{
      var res=await fetch(PAY_API,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          items:items,
          customer:{
            name:name, phone:phone,
            email:document.getElementById("f-email").value.trim(),
            city:CDEK_ON?(D.city?D.city.name:""):document.getElementById("f-city").value.trim(),
            address:CDEK_ON?"":document.getElementById("f-address").value.trim(),
            comment:document.getElementById("f-comment").value.trim()
          },
          delivery:delivery
        })
      });
      var data=null; try{ data=await res.json(); }catch(e){}
      if(res.ok && data && data.confirmation_url){ if(window.scGoal) scGoal("checkout"); saveCart([]); setTimeout(function(){ window.location.href=data.confirmation_url; },350); return; }
      btn.disabled=false; btn.textContent="Оплатить "+money(grandTotal());
      errBox.textContent=(data&&data.error)?data.error:"Не удалось перейти к оплате. Попробуйте ещё раз или напишите в Telegram @selfcard_nfc.";
      errBox.style.display="block";
    }catch(e){
      btn.disabled=false; btn.textContent="Оплатить "+money(grandTotal());
      errBox.textContent="Нет связи с сервером оплаты. Попробуйте ещё раз или напишите в Telegram @selfcard_nfc.";
      errBox.style.display="block";
    }
  }

  /* ---------- Доставка СДЭК ---------- */
  var CDEK_API = "https://app.selfcards.ru/api/cdek";
  var CDEK_ON = false;
  var CDEK_FREE = 0;
  var D = {city:null, mode:"pvz", points:[], pvz:null, addr:"", q:"", quote:null, loading:false, err:""};
  try{ var sv=JSON.parse(localStorage.getItem("selfcards_dlv")||"null"); if(sv&&sv.city){ D.city=sv.city; D.mode=sv.mode||"pvz"; D.addr=sv.addr||""; D._pvzCode=sv.pvz||""; } }catch(e){}
  function dlvSave(){ try{ localStorage.setItem("selfcards_dlv", JSON.stringify({city:D.city, mode:D.mode, addr:D.addr, pvz:D.pvz?D.pvz.code:""})); }catch(e){} }
  function esc(t){ return String(t==null?"":t).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];}); }
  function grandTotal(){ return cartTotal() + (CDEK_ON && D.quote ? D.quote.price : 0); }
  function cartItemsForApi(){ return getCart().map(function(x){ return {sku:SKU_MAP[x.id], qty:x.qty}; }).filter(function(i){ return i.sku; }); }

  function dlvHTML(){
    return '<div class="block-title" style="margin-top:20px">Доставка СДЭК</div>'+
      (CDEK_FREE ? '<div style="font-size:13px;color:#86efac;margin-top:-4px">🎁 Бесплатная доставка в пункт выдачи от '+money(CDEK_FREE)+'</div>' : '')+
      '<div class="dlv-wrap"><label>Город *</label><input id="d-city" autocomplete="off" placeholder="Начните вводить город"><div id="d-sug" class="dlv-sug" style="display:none"></div></div>'+
      '<div class="dlv-tabs"><button type="button" id="d-m-pvz">Пункт выдачи</button><button type="button" id="d-m-door">Курьер до двери</button></div>'+
      '<div id="d-pvz-box"><input id="d-pvz-q" style="margin-top:10px" placeholder="Поиск: улица, метро, район"><div id="d-pvz-list" class="dlv-list"></div></div>'+
      '<div id="d-door-box" style="display:none"><label>Адрес *</label><input id="d-addr" autocomplete="street-address" placeholder="Улица, дом, квартира"></div>'+
      '<div id="d-q" class="dlv-q" style="display:none"></div>';
  }

  function dlvMount(){
    var ci=document.getElementById("d-city"), sug=document.getElementById("d-sug");
    if(!ci) return;
    ci.value = D.city ? D.city.name : "";
    var tmr=null;
    ci.addEventListener("input", function(){
      clearTimeout(tmr); var q=ci.value.trim();
      if(q.length<2){ sug.style.display="none"; return; }
      tmr=setTimeout(async function(){
        try{
          var r=await fetch(CDEK_API+"?action=cities&q="+encodeURIComponent(q)); var list=await r.json();
          if(!Array.isArray(list)||!list.length){ sug.innerHTML='<div style="cursor:default">Город не найден</div>'; sug.style.display="block"; return; }
          sug.innerHTML=list.map(function(c,i){ return '<div data-i="'+i+'">'+esc(c.name)+'</div>'; }).join("");
          sug.style.display="block";
          Array.prototype.forEach.call(sug.children,function(el){ el.addEventListener("mousedown",function(e){ e.preventDefault(); var c=list[+el.getAttribute("data-i")]; if(c) dlvSetCity(c); }); });
        }catch(e){ sug.style.display="none"; }
      },300);
    });
    ci.addEventListener("blur", function(){ setTimeout(function(){ sug.style.display="none"; if(D.city) ci.value=D.city.name; },150); });
    document.getElementById("d-m-pvz").addEventListener("click", function(){ dlvSetMode("pvz"); });
    document.getElementById("d-m-door").addEventListener("click", function(){ dlvSetMode("door"); });
    var pq=document.getElementById("d-pvz-q"); pq.value=D.q;
    pq.addEventListener("input", function(){ D.q=pq.value; dlvRenderPoints(); });
    var ad=document.getElementById("d-addr"); ad.value=D.addr;
    ad.addEventListener("input", function(){ D.addr=ad.value; dlvSave(); });
    dlvSetMode(D.mode, true);
    if(D.city){ if(!D.points.length) dlvLoadPoints(); else dlvRenderPoints(); dlvQuote(); }
    dlvRenderQuote();
  }

  function dlvSetCity(c){
    D.city={code:c.code, name:c.name}; D.points=[]; D.pvz=null; D._pvzCode=""; D.q=""; D.quote=null; D.err="";
    document.getElementById("d-city").value=c.name; document.getElementById("d-sug").style.display="none";
    var pq=document.getElementById("d-pvz-q"); if(pq) pq.value="";
    dlvSave(); dlvLoadPoints(); dlvQuote();
  }

  function dlvSetMode(m, silent){
    D.mode=m;
    document.getElementById("d-m-pvz").className = m==="pvz"?"on":"";
    document.getElementById("d-m-door").className = m==="door"?"on":"";
    document.getElementById("d-pvz-box").style.display = m==="pvz"?"block":"none";
    document.getElementById("d-door-box").style.display = m==="door"?"block":"none";
    if(!silent){ D.quote=null; dlvSave(); dlvQuote(); }
  }

  async function dlvLoadPoints(){
    var box=document.getElementById("d-pvz-list"); if(!box||!D.city) return;
    box.innerHTML='<div class="dlv-pt">Загружаем пункты выдачи…</div>';
    try{
      var r=await fetch(CDEK_API+"?action=points&city="+D.city.code); var list=await r.json();
      D.points=Array.isArray(list)?list:[];
      if(D._pvzCode){ D.pvz=D.points.find(function(p){return p.code===D._pvzCode;})||null; D._pvzCode=""; }
    }catch(e){ D.points=[]; }
    dlvRenderPoints(); dlvRenderQuote();
  }

  function dlvRenderPoints(){
    var box=document.getElementById("d-pvz-list"); if(!box) return;
    if(!D.city){ box.innerHTML='<div class="dlv-pt">Сначала выберите город</div>'; return; }
    if(!D.points.length){ box.innerHTML='<div class="dlv-pt">В этом городе нет пунктов выдачи СДЭК — выберите курьера</div>'; return; }
    var q=(D.q||"").toLowerCase().trim();
    var list=D.points.filter(function(p){ return !q || (p.address+" "+p.name).toLowerCase().indexOf(q)>=0; });
    if(D.pvz && list.indexOf(D.pvz)<0 && !q) list.unshift(D.pvz);
    var shown=list.slice(0,80);
    box.innerHTML = shown.length ? shown.map(function(p,i){
      return '<div class="dlv-pt'+(D.pvz&&D.pvz.code===p.code?' on':'')+'" data-c="'+esc(p.code)+'"><b>'+esc(p.address)+'</b>'+esc(p.name)+(p.work_time?'<br><small>'+esc(p.work_time)+'</small>':'')+'</div>';
    }).join("") + (list.length>80?'<div class="dlv-pt"><small>Показаны 80 из '+list.length+' — уточните поиск</small></div>':'')
      : '<div class="dlv-pt">Ничего не найдено</div>';
    Array.prototype.forEach.call(box.querySelectorAll("[data-c]"),function(el){
      el.addEventListener("click",function(){
        var c=el.getAttribute("data-c"); D.pvz=D.points.find(function(p){return p.code===c;})||null;
        dlvSave(); dlvRenderPoints(); dlvRenderQuote();
      });
    });
  }

  var dlvSeq=0;
  async function dlvQuote(){
    if(!D.city) return;
    var my=++dlvSeq; D.loading=true; D.err=""; dlvRenderQuote();
    try{
      var r=await fetch(CDEK_API,{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({action:"calc", city_code:D.city.code, mode:D.mode, items:cartItemsForApi()})});
      var d=await r.json();
      if(my!==dlvSeq) return;
      if(r.ok && d && typeof d.price==="number"){ D.quote=d; } else { D.quote=null; D.err=(d&&d.error)||"Не удалось рассчитать доставку"; }
    }catch(e){ if(my!==dlvSeq) return; D.quote=null; D.err="Нет связи со службой доставки"; }
    D.loading=false; dlvRenderQuote();
  }

  function dlvRenderQuote(){
    var el=document.getElementById("d-q"), sd=document.getElementById("sum-dlv"), st=document.getElementById("sum-total"), btn=document.getElementById("f-submit");
    if(!el) return;
    var txt="", cls="dlv-q";
    if(!D.city){ el.style.display="none"; }
    else if(D.loading){ txt="Считаем стоимость доставки…"; }
    else if(D.err){ txt=esc(D.err); cls+=" err"; }
    else if(D.quote){
      var days=D.quote.period_min?(" · "+D.quote.period_min+(D.quote.period_max&&D.quote.period_max!==D.quote.period_min?"–"+D.quote.period_max:"")+" дн."):"";
      txt="СДЭК "+(D.mode==="pvz"?"до пункта выдачи":"курьером")+": <b>"+(D.quote.price?money(D.quote.price):"бесплатно")+"</b>"+days;
      if(D.mode==="pvz" && !D.pvz) txt+="<br><small>Выберите пункт выдачи из списка</small>";
      if(D.mode==="pvz" && D.pvz) txt+="<br><small>Пункт: "+esc(D.pvz.address)+"</small>";
      if(D.quote.discount>0) txt+="<br><small style=\"color:#86efac\">"+(D.quote.price?"Скидка на доставку "+money(D.quote.discount):"Доставка за наш счёт 🎁")+"</small>";
      else if(CDEK_FREE && D.mode==="pvz" && cartTotal()<CDEK_FREE) txt+="<br><small style=\"color:#86efac\">Добавьте товаров на "+money(CDEK_FREE-cartTotal())+" — доставка в пункт выдачи станет бесплатной</small>";
    }
    if(txt){ el.innerHTML=txt; el.className=cls; el.style.display="block"; }
    if(sd){ sd.textContent = D.quote ? (D.quote.price?money(D.quote.price):"бесплатно") : (D.city?(D.loading?"считаем…":"—"):"выберите город"); sd.style.color = D.quote?"":"var(--t3)"; }
    if(st) st.textContent=money(grandTotal());
    if(btn && !btn.disabled) btn.textContent="Оплатить "+money(grandTotal());
  }

  (async function(){
    var forceTest=/[?&]cdektest=1/.test(location.search);
    try{
      var r=await fetch(CDEK_API+"?action=info"); var d=await r.json();
      CDEK_ON = !!d && (d.mode==="prod" || forceTest);
      CDEK_FREE = (d && d.free_from) || 0;
    }catch(e){ CDEK_ON=false; }
    if(CDEK_ON) render();
  })();

  render();
</script>
<script>if(window.scGoal) scGoal("cart_open");</script>
</body>
</html>
